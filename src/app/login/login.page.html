<ion-content [fullscreen]="true">
  <div class="card-section">
    <ion-card>

      <ion-card-content>

        <!-- Header Login -->
        <div class="login-header">
          <h1>Login</h1>
          <p>Use your credentials to login</p>
        </div>

        <!-- Email -->
        <ion-item>
          <ion-input label="Email" labelPlacement="floating" placeholder="Enter your email" type="email"
            [(ngModel)]="email">
          </ion-input>
        </ion-item>

        <!-- Password -->
        <ion-item>
          <ion-input type="password" label="Password" labelPlacement="floating" placeholder="Enter your password"
            [(ngModel)]="password">

            <ion-input-password-toggle slot="end">
            </ion-input-password-toggle>

          </ion-input>
        </ion-item>

        <!-- Login Button -->
        <ion-button expand="block" (click)="login()">
          Login
        </ion-button>

        <!-- Register -->
        <ion-button expand="block" fill="clear" routerLink="/register">
          Create a new account
        </ion-button>

      </ion-card-content>

    </ion-card>
  </div>
</ion-content>
