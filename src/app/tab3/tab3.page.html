<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tambah Jadwal Kuliah
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Isi informasi jadwal kuliah</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-input label="Mata Kuliah" placeholder="Isikan Nama Mata Kuliah"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Dosen" placeholder="Isikan Nama Dosen"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Pukul" placeholder="Isikan Jam"></ion-input>
        </ion-item>

        <ion-button expand="block" color="primary">Simpan</ion-button>

      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
